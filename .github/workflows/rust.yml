name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Linux deps
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y lib{pango1.0,x11,xext,xft,xinerama}-dev \
            lib{xcursor,xrender,xfixes,png,gl1-mesa,rust-alsa-sys}-dev \
            libglu1-mesa-dev libdbus-1-dev
            
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: clippy
        
    - uses: Swatinem/rust-cache@v2

    - name: Build (GUI)
      run: cargo build --bin swyh-rs
      
    - name: Build (CLI)
      run: cargo build --bin swyh-rs-cli --features cli --no-default-features

    - name: Clippy (GUI)
      run: cargo clippy --bin swyh-rs --all-targets -- -D warnings
      
    - name: Clippy (CLI)
      run: cargo clippy --bin swyh-rs-cli --features cli --no-default-features --all-targets -- -D warnings

    - name: Test (GUI)
      run: cargo test
      
    - name: Test (CLI)
      run: cargo test --features cli --no-default-features

  # ==========================================
  # 新增任务：编译 Windows ARM64 原生版本
  # ==========================================
  build-windows-arm64:
    name: Build Windows ARM64 (Cross-Compile)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      # 1. 安装 Ninja (项目的 fltk GUI 库底层依赖 C++，交叉编译时 CMake 需要 Ninja 来加速构建)
      - name: Install Ninja
        run: choco install ninja -y

      # 2. 关键步骤：配置 MSVC 交叉编译环境 (让 x64 的 GitHub Runner 能够调用 ARM64 的 cl.exe 编译器)
      - name: Setup MSVC cross-compiler (x64 -> ARM64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64_arm64

      # 3. 安装 Rust 工具链，并明确指定添加 ARM64 目标
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      # 4. 编译带 GUI 的主程序 (Release 模式)
      - name: Build GUI (ARM64)
        run: cargo build --release --target aarch64-pc-windows-msvc --bin swyh-rs

      # 5. 编译纯命令行的 CLI 版本
      - name: Build CLI (ARM64)
        run: cargo build --release --target aarch64-pc-windows-msvc --bin swyh-rs-cli --features cli --no-default-features

      # 6. 将编译好的 exe 打包上传，以便你在 Actions 页面下载
      - name: Upload ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swyh-rs-windows-arm64-binaries
          path: target/aarch64-pc-windows-msvc/release/*.exe
